<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#5a2470"><title>Studio Kel Nascimento</title><meta name="description" content="Realçando sua beleza através de cada detalhe."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
<style id="st">
:root{--roxo:#5a2470;--roxo2:#8a3fa3;--lilas:#c8a2dc;--rosa:#d98bc4;--ouro:#c6a26b;--ouro2:#e7cf9f;--off:#faf6f3;--ink:#3d1f4a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
html{overflow-x:hidden}
.stage{overflow-x:hidden;overflow-x:clip}
body{font-family:'Jost',system-ui,sans-serif;background:var(--off);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit}
.stage{min-height:100vh;display:flex;justify-content:center;position:relative}
.device{width:100%;max-width:480px;position:relative;z-index:2}
.island{display:none}
.screen{min-height:100vh;position:relative;z-index:2;padding:30px 20px calc(36px + env(safe-area-inset-bottom))}
.bgl{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:linear-gradient(170deg,var(--b1) 0%,var(--b2) 100%)}
.tema-lavanda{--b1:#f5ecfa;--b2:#e4cff0;--g1:#d7b2ee;--g2:#f4d3ea;--g3:#f2e1c4}
.tema-rose{--b1:#fcf0f3;--b2:#f1d2de;--g1:#efb9cf;--g2:#e4c3f0;--g3:#f5dfc2}
.tema-champagne{--b1:#fcf6ec;--b2:#efdfc6;--g1:#e9cf9e;--g2:#ead0ef;--g3:#f6d9d3}
.tema-branco{--b1:#fbf8f6;--b2:#f2eae7;--g1:#e6d3ef;--g2:#f2e2da;--g3:#eee0f4}
.blob{position:absolute;width:80vmax;height:80vmax;border-radius:50%;opacity:.75;will-change:transform;animation:blob 20s ease-in-out infinite alternate}
.blob.b1{left:-40vmax;top:-30vmax;background:radial-gradient(circle,var(--g1) 0,transparent 62%)}
.blob.b2{right:-45vmax;top:20%;background:radial-gradient(circle,var(--g2) 0,transparent 62%);animation-duration:26s;animation-direction:alternate-reverse}
.blob.b3{left:-20vmax;bottom:-50vmax;background:radial-gradient(circle,var(--g3) 0,transparent 62%);animation-duration:23s}
.lights{position:absolute;inset:0;opacity:.5}
.strand{position:absolute;left:-2%;width:104%;height:46px}
.strand svg{position:absolute;inset:0;width:100%;height:100%}
.strand i{position:absolute;width:7px;height:11px;margin-left:-3.5px;border-radius:50% 50% 46% 46%/62% 62% 38% 38%;background:radial-gradient(circle at 40% 35%,#fff 0,var(--c) 60%);opacity:.3;animation:blink 2.8s ease-in-out infinite;animation-delay:var(--dl);will-change:opacity}
.strand i::after{content:'';position:absolute;left:-7px;top:-5px;width:21px;height:21px;border-radius:50%;background:radial-gradient(circle,var(--c) 0,transparent 68%);opacity:.75}
.strand i::before{content:'';position:absolute;left:1.5px;top:-3px;width:4px;height:4px;border-radius:1px;background:#b8955e}
@media(min-width:900px){
 body.editing .stage{padding-right:460px;transition:padding .4s}
 .device{max-width:520px}
 .screen{padding-top:52px;padding-bottom:60px}
}
/* hero */
.hero{text-align:center;position:relative}
.logo-wrap{width:min(82%,310px);margin:0 auto;position:relative}
.logo-wrap>img{width:100%;display:block}
.first .logo-wrap>img{animation:logoin 1.3s cubic-bezier(.2,.8,.2,1) both}
.first .slogan{animation:rise .9s cubic-bezier(.2,.8,.2,1) .35s both}
.first .divider{animation:grow .9s cubic-bezier(.2,.8,.2,1) .55s both}
.first .intro{animation:rise .9s cubic-bezier(.2,.8,.2,1) .65s both}
.slogan{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:21px;letter-spacing:.2px;line-height:1.25;color:var(--roxo);margin-top:4px}
.divider{display:flex;align-items:center;gap:10px;justify-content:center;margin:14px auto;color:var(--ouro);font-size:12px}
.divider span{height:1px;width:64px;background:linear-gradient(90deg,transparent,var(--ouro))}
.divider span:last-child{background:linear-gradient(270deg,transparent,var(--ouro))}
.intro{font-size:14.5px;line-height:1.7;color:#6a5070;max-width:350px;margin:0 auto;font-weight:400}
.spark{display:none}
/* hat */
.hat{position:absolute;left:var(--hx);top:var(--hy);width:var(--hw);transform:translate(-50%,-78%) rotate(var(--hr));transform-origin:50% 90%;pointer-events:none;z-index:3}
.hat .hin{transform-origin:50% 88%;animation:sway 3.6s ease-in-out infinite;filter:drop-shadow(0 6px 6px rgba(90,20,40,.25));will-change:transform}
.hat svg{width:100%;display:block;overflow:visible}
.first .hat{animation:hatdrop 1.1s cubic-bezier(.3,1.5,.5,1) both .35s}
.orns{position:absolute;left:0;right:0;top:0;height:0;pointer-events:none;z-index:4}
.orn{position:absolute;top:-34px;transform-origin:50% 0;will-change:transform;animation:swing var(--sp) ease-in-out infinite alternate;animation-delay:var(--dl)}
.first .orn{animation:ornin 1.2s cubic-bezier(.3,1.5,.5,1) both,swing var(--sp) ease-in-out 1.2s infinite alternate}
.orn .th{display:block;width:1.2px;height:var(--len);margin:0 auto;background:linear-gradient(#e7cf9f,#c6a26b)}
.orn svg{width:var(--s);display:block;margin:-1px auto 0;overflow:visible;filter:drop-shadow(0 7px 7px rgba(60,20,70,.3))}
.xmas{display:inline-flex;align-items:center;gap:8px;margin:14px auto 0;padding:8px 16px;border-radius:99px;background:linear-gradient(120deg,#5a2470,#8a3fa3);color:#f4e2b8;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:17px;box-shadow:0 8px 20px -10px rgba(90,36,112,.8),inset 0 0 0 1px rgba(231,207,159,.55)}
.xmas svg{width:18px;height:18px}
/* snow */
.snow{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.flake{position:absolute;top:-24px;color:var(--c);opacity:.8;animation:fall var(--t) linear infinite;animation-delay:var(--dl);will-change:transform}
.flake i{display:block;font-style:normal}
/* cards */
.cards{display:flex;flex-direction:column;gap:22px;margin-top:28px;padding-right:6px}
.card{position:relative;display:flex;align-items:center;min-height:112px;padding:20px 120px 20px 24px;border-radius:20px;text-decoration:none;color:#fff;cursor:pointer;transform:perspective(800px) translateX(var(--tx,0px)) rotate(var(--rz,0deg)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty,0px)) scale(var(--sc,1));
 background:linear-gradient(118deg,#4e1d63 0%,#7f3799 50%,#b872c4 100%);
 box-shadow:0 16px 30px -16px rgba(90,36,112,.75),inset 0 1px 0 rgba(255,255,255,.25);
 transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s;-webkit-tap-highlight-color:transparent;isolation:isolate;transform-style:preserve-3d}
.card:nth-child(even){background:linear-gradient(118deg,#5f2577 0%,#8e45a8 50%,#c07ac9 100%)}
.card.rv{--tx:-56px;--rz:-3deg;opacity:0}
.card.rv:nth-child(even){--tx:56px;--rz:3deg}
.card.rv.in{--tx:0px;--rz:0deg;opacity:1;transition:transform .95s cubic-bezier(.2,1.25,.35,1),opacity .6s ease,box-shadow .45s}
.card.rv .card-ico{opacity:0;transform:translateY(-52%) translateZ(30px) scale(.2) rotate(-70deg)}
.card.rv.in .card-ico{opacity:1;transform:translateY(-52%) translateZ(30px) rotate(-8deg);transition:transform 1s cubic-bezier(.3,1.6,.5,1) .3s,opacity .4s .3s}
.card.rv.in:hover .card-ico{transform:translateY(-62%) translateZ(30px) rotate(4deg) scale(1.1);transition-delay:0s}
.card::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(120deg,rgba(231,207,159,.95),rgba(255,255,255,.08) 40%,rgba(231,207,159,.65));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.shine{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none;z-index:-1}
.shine::after{content:'';position:absolute;top:0;left:0;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.3),transparent);transform:translateX(-160%) skewX(-20deg);transition:transform .9s ease}
.card:hover .shine::after{transform:translateX(330%) skewX(-20deg)}
.shine::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at var(--mx,80%) var(--my,30%),rgba(255,255,255,.22),transparent 55%);opacity:0;transition:opacity .4s}
.card:hover .shine::before{opacity:1}
.card:hover{--ty:-5px;box-shadow:0 28px 44px -18px rgba(90,36,112,.85),inset 0 1px 0 rgba(255,255,255,.3)}
.card:active{--sc:.97;transition-duration:.12s}
.card-txt strong{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:24px;line-height:1.06;display:block;text-shadow:0 1px 6px rgba(60,10,80,.25);letter-spacing:.3px}
.card-txt em{font-style:normal;display:inline-flex;align-items:center;gap:5px;margin-top:12px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;background:rgba(255,255,255,.96);color:var(--roxo);padding:5px 10px 5px 12px;border-radius:99px;font-weight:600;box-shadow:0 4px 10px -4px rgba(60,10,80,.4)}
.card-txt em{position:relative}
.card-txt em::after{content:'';position:absolute;inset:0;border-radius:inherit;border:2px solid rgba(255,255,255,.75);display:none;pointer-events:none}
.card-txt em svg{width:10px;height:10px;transition:transform .3s}
.card:hover .card-txt em svg{transform:translateX(3px)}
.card-ico{position:absolute;right:-4px;top:50%;width:118px;height:118px;transform:translateY(-52%) translateZ(30px) rotate(-8deg);transition:transform .6s cubic-bezier(.3,1.5,.5,1)}
.card-ico svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 9px 9px rgba(30,4,40,.45));will-change:transform}
.card:hover .card-ico{transform:translateY(-62%) translateZ(30px) rotate(4deg) scale(1.1)}
.card.tap .card-ico svg{animation:jelly .7s cubic-bezier(.3,1.5,.5,1)}
.i3d .glow{transition:opacity .4s}.card:hover .i3d .glow{opacity:.55}

.snowcap{position:absolute;left:14px;top:-6px;width:46%;height:13px;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(90,36,112,.25))}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rip .65s ease-out forwards;pointer-events:none}

/* splash */
#splash{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:linear-gradient(170deg,var(--b1),var(--b2));transition:opacity .65s ease,visibility .65s}
#splash.out{opacity:0;visibility:hidden}
.sp-in{width:min(74vw,330px);animation:spgrow 2s cubic-bezier(.2,.8,.2,1) both}
.sp-in svg{width:100%;display:block;overflow:visible}
.scrib{fill:none;stroke:#fff;stroke-width:120;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.25s cubic-bezier(.55,0,.35,1) .15s forwards}
.spk{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:spk .7s cubic-bezier(.3,1.6,.5,1) 1.2s forwards}
.spl{transform-origin:center;transform:scaleX(0);animation:spl .8s cubic-bezier(.2,.8,.2,1) 1.1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes spk{to{transform:scale(1) rotate(90deg)}}
@keyframes spl{to{transform:scaleX(1)}}
@keyframes spgrow{from{transform:scale(.94)}to{transform:scale(1)}}
/* promo: voucher ticket */
.promo{position:relative;margin:20px auto 4px;max-width:390px;filter:drop-shadow(0 18px 22px rgba(70,20,90,.38))}
.first .promo{animation:tkin 1s cubic-bezier(.2,1.2,.35,1) .45s both}
.tk{position:relative;display:flex;align-items:stretch;border-radius:20px;overflow:hidden;color:#fff;text-decoration:none;text-align:left;
 background:radial-gradient(120% 90% at 0% 0%,#9a4fbb 0,transparent 55%),linear-gradient(125deg,#3f1352 0%,#6a2785 55%,#8f45ab 100%);
 -webkit-mask:radial-gradient(circle 11px at var(--nx) 0,#0000 97%,#000) top/100% 51% no-repeat,radial-gradient(circle 11px at var(--nx) 100%,#0000 97%,#000) bottom/100% 51% no-repeat;
 mask:radial-gradient(circle 11px at var(--nx) 0,#0000 97%,#000) top/100% 51% no-repeat,radial-gradient(circle 11px at var(--nx) 100%,#0000 97%,#000) bottom/100% 51% no-repeat;--nx:33%}
.tk.solo{--nx:-20px}
.tk::before{content:'';position:absolute;inset:6px;border-radius:15px;border:1px solid rgba(231,207,159,.45);pointer-events:none}
.tk::after{content:'';position:absolute;top:0;left:0;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);transform:translateX(-160%) skewX(-18deg);pointer-events:none}
.first .tk::after{animation:tkshine 1.4s ease-out 1.4s}
.tk-l{flex:0 0 33%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 6px;border-right:1.5px dashed rgba(231,207,159,.55);text-align:center}
.tk-big{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:46px;line-height:.9;background:linear-gradient(180deg,#fff5d8 0%,#f0cf86 45%,#c0903f 70%,#f6dea0 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.tk-small{font-size:11px;letter-spacing:.32em;font-weight:600;color:#f1d79e;margin-top:4px;padding-left:.32em}
.tk-r{flex:1;padding:16px 18px 16px 16px;min-width:0}
.tk-tag{display:inline-flex;align-items:center;gap:6px;font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:#f1d79e;font-weight:600}
.tk-tag i{width:5px;height:5px;border-radius:50%;background:#f1d79e;box-shadow:0 0 6px #f1d79e}
.tk-tx{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:21px;line-height:1.08;margin:6px 0 4px;color:#fff}
.tk-dt{list-style:none;margin:4px 0 6px;padding:0}
.tk-dt li{position:relative;padding-left:14px;font-size:12.5px;line-height:1.5;color:#f3e6fa}
.tk-dt li::before{content:'✦';position:absolute;left:0;top:0;font-size:9px;color:#f1d79e}
.tk-val{font-size:11.5px;color:#dcc4ea}
.tk-btn{display:inline-flex;align-items:center;gap:5px;margin-top:10px;padding:7px 13px 7px 14px;border-radius:99px;background:linear-gradient(120deg,#c9a062,#f1d9a3,#b8894a);color:#3a1450;font-size:11.5px;font-weight:600;letter-spacing:.05em;box-shadow:0 6px 14px -6px rgba(0,0,0,.5)}
.tk-btn svg{width:9px;height:9px;transition:transform .3s}
.tk:hover .tk-btn svg{transform:translateX(3px)}
.tk:active{transform:scale(.98)}
.tk{transition:transform .25s}
@keyframes tkin{0%{opacity:0;transform:translateY(18px) scale(.92) rotate(-2deg)}100%{opacity:1;transform:none}}
@keyframes tkshine{to{transform:translateX(330%) skewX(-18deg)}}
/* sections */
.sec{margin-top:36px}
.rvs{opacity:0;transform:translateY(26px);transition:opacity .8s ease,transform .9s cubic-bezier(.2,.9,.3,1)}
.rvs.in{opacity:1;transform:none}
.sh{font-family:'Cormorant Garamond',serif;font-size:29px;color:var(--roxo);text-align:center;font-weight:700;line-height:1.1}
.sh::after{content:'';display:block;width:70px;height:1px;margin:9px auto 0;background:linear-gradient(90deg,transparent,var(--ouro),transparent)}
.gtrack{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:16px 11% 8px;margin:0 -20px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.gtrack::-webkit-scrollbar{display:none}
.gi{flex:0 0 78%;scroll-snap-align:center;margin:0;border-radius:22px;overflow:hidden;position:relative;aspect-ratio:1;background:#efe3f4;box-shadow:0 18px 30px -20px rgba(90,36,112,.8);border:1px solid rgba(198,162,107,.55)}
.gi img{width:100%;height:100%;object-fit:cover;display:block}
.gi figcaption{position:absolute;left:0;right:0;bottom:0;padding:26px 14px 11px;background:linear-gradient(transparent,rgba(40,10,50,.7));color:#fff;font-size:13.5px}
.gdots{display:flex;justify-content:center;gap:6px;margin-top:8px}
.gdots i{width:6px;height:6px;border-radius:9px;background:#d6c0e1;transition:.35s}
.gdots i.on{width:20px;background:var(--roxo)}
.gempty{margin-top:14px;padding:22px;border:1.5px dashed #cdb3dd;border-radius:18px;text-align:center;color:#8a7090;font-size:13.5px;background:rgba(255,255,255,.5)}
.rgl{background:rgba(255,255,255,.93);border:1px solid #eadcf0;border-radius:22px;padding:4px 16px;margin-top:16px;box-shadow:0 14px 30px -24px rgba(90,36,112,.6)}
.rgi{display:flex;gap:13px;align-items:flex-start;padding:13px 0;border-bottom:1px dashed #e4d3ea}
.rgi:last-child{border-bottom:0}
.rgic{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,#f5eaf9,#e3cdee);display:grid;place-items:center;color:var(--roxo);flex:none;box-shadow:inset 0 0 0 1px rgba(198,162,107,.35)}
.rgic svg{width:19px;height:19px}
.rgi b{display:block;font-size:14.5px;color:var(--roxo);font-weight:600;margin-top:1px}
.rgi p{font-size:13.2px;color:#6f5a76;line-height:1.5;margin-top:2px}
.pix{display:flex;align-items:center;gap:10px;width:100%;margin-top:12px;padding:13px 16px;border-radius:16px;border:1px solid rgba(198,162,107,.7);background:linear-gradient(135deg,#fffaf3,#f7eefa);color:var(--roxo);cursor:pointer;text-align:left;font:inherit;transition:transform .25s}
.pix:active{transform:scale(.98)}
.pix svg{width:22px;height:22px;flex:none;color:#a7804a}
.pix span{font-weight:600;font-size:14px}
.pix small{margin-left:auto;font-size:12px;color:#8a7090;max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-ico img.cimg{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 9px 9px rgba(30,4,40,.45))}
.ih img.cimg{width:42px;height:42px;object-fit:contain}

/* esmalte stain on the card corner */
.stain{position:absolute;right:-1px;bottom:-21px;width:210px;height:84px;pointer-events:none;z-index:1}
.stain svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 3px 3px rgba(70,5,45,.35))}
.card-ico{z-index:2}
.card.rv .stain .sb{transform:scale(.05);opacity:0;transform-origin:209px 63px}
.card.rv.in .stain .sb{transform:none;opacity:1;transition:transform 1.3s cubic-bezier(.25,1.15,.4,1) 1.05s,opacity .3s 1.05s}
.card.rv .stain .dr{transform:scaleY(0);transform-box:fill-box;transform-origin:50% 0}
.card.rv.in .stain .dr{transform:none;transition:transform 1s cubic-bezier(.5,0,.6,1) var(--dd,2s)}
/* footer */
.foot{margin-top:34px;text-align:center}
.addr{display:flex;gap:12px;align-items:flex-start;text-align:left;background:rgba(255,255,255,.75);border:1px solid #efe2f2;border-radius:18px;padding:14px 16px;box-shadow:0 10px 24px -18px rgba(90,36,112,.5)}
.addr .mini{width:40px;height:40px;flex:none}
.addr b{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ouro)}
.addr p{font-size:13.5px;line-height:1.5;color:#5e4566}
.addr p.h{color:var(--roxo);font-weight:500;margin-top:4px}
.soc{display:flex;justify-content:center;gap:14px;margin:20px 0 10px}
.soc a{width:46px;height:46px;display:block;border-radius:14px;filter:drop-shadow(0 6px 8px rgba(60,15,80,.25));transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.soc a:hover{transform:translateY(-4px) rotate(-6deg) scale(1.08)}
.soc svg{width:100%;height:100%}
.tel{font-size:14px;color:var(--roxo);font-weight:500;letter-spacing:.04em}
.copy{font-size:11.5px;color:#a08aa6;margin-top:8px;letter-spacing:.05em}
.thx{display:flex;align-items:center;justify-content:center;gap:12px;margin:22px auto 4px}
.thx p{font-family:'Great Vibes',cursive;font-size:27px;white-space:nowrap;color:#6b2b84;line-height:1.1}
.thx .ln{height:1px;width:42px;background:linear-gradient(90deg,transparent,#b98ad0)}
.thx .ln:last-child{background:linear-gradient(270deg,transparent,#b98ad0)}
.cred{display:inline-block;margin-top:14px;font-size:10.5px;letter-spacing:.08em;color:#b4a0bb;text-decoration:none;opacity:.8;transition:opacity .3s,color .3s}
.cred b{font-weight:500}
.cred:hover{opacity:1;color:#6b2b84}
.lock{margin:14px auto 0;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;border:1px solid #eadcef;background:transparent;color:#c2acc9;cursor:pointer;transition:.3s}
.lock:hover{color:var(--roxo);border-color:var(--lilas)}
.lock svg{width:13px;height:13px}
/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.sheet .bd{position:absolute;inset:0;background:rgba(40,15,50,.45);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);opacity:0;transition:opacity .35s}
.sheet .pn{position:relative;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;background:var(--off);border-radius:30px 30px 0 0;padding:12px 20px calc(26px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .5s cubic-bezier(.2,.8,.2,1);box-shadow:0 -20px 60px -20px rgba(60,20,80,.4)}
.sheet.open{pointer-events:auto}.sheet.open .bd{opacity:1}.sheet.open .pn{transform:none}
@media(min-width:900px){.sheet{align-items:center}.sheet .pn{border-radius:30px;max-width:440px;transform:translateY(30px) scale(.95);opacity:0;transition:.45s cubic-bezier(.2,.8,.2,1)}.sheet.open .pn{opacity:1;transform:none}body.editing .sheet{padding-right:460px}}
.grab{width:44px;height:5px;border-radius:9px;background:#e3d3e8;margin:0 auto 14px}
.x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;border:0;background:#f1e7f4;color:var(--roxo);font-size:20px;line-height:1;cursor:pointer;transition:.25s}
.x:hover{transform:rotate(90deg);background:#e8d8ee}
.pn h3{font-family:'Cormorant Garamond',serif;font-size:30px;color:var(--roxo);text-align:center;font-weight:700}
.pn .sub{text-align:center;font-size:13.5px;color:#7a6280;margin:4px auto 18px;max-width:320px;line-height:1.55}
.svc{display:flex;gap:14px;align-items:center;padding:12px;background:#fff;border-radius:18px;box-shadow:0 8px 22px -14px rgba(90,36,112,.45);border:1px solid #f0e4f3;margin-bottom:12px;opacity:0;transform:translateY(14px)}
.sheet.open .svc{animation:rise .55s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--d)}
.svc .ph{width:70px;height:70px;border-radius:15px;flex:none;object-fit:cover;background:linear-gradient(135deg,#f3e4f6,#e0c0e6);display:grid;place-items:center}
.svc .ph svg{width:46px;height:46px}
.svc h4{font-family:'Cormorant Garamond',serif;font-size:20px;line-height:1.1;color:var(--roxo);font-weight:700}
.svc p{font-size:12.5px;color:#7a6280;line-height:1.45;margin-top:3px}
.svc.np{padding:12px 12px 12px 16px;margin-bottom:8px;border-radius:15px}
.svc.np h4{font-size:18px}
.svc .prc{display:block;color:#a7804a;font-weight:600;font-size:13px;margin-top:4px}
.cat{display:flex;align-items:center;gap:10px;margin:20px 0 10px}
.cat span{background:#ecdff4;color:var(--roxo);font-family:'Cormorant Garamond',serif;font-weight:700;letter-spacing:.2em;text-transform:uppercase;font-size:15px;padding:5px 14px;border-radius:99px}
.cat::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--ouro),transparent)}
.svc .ag{flex:none;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:linear-gradient(120deg,#5a2470,#9b4fb5);padding:6px 11px;border-radius:99px;text-decoration:none;white-space:nowrap}
.svc .bx{flex:1;min-width:0}
.cta{display:block;text-align:center;margin-top:16px;padding:15px;border-radius:16px;background:linear-gradient(120deg,#5a2470,#9b4fb5);color:#fff;text-decoration:none;font-weight:600;letter-spacing:.03em;box-shadow:0 12px 24px -12px #5a2470}
.empty{text-align:center;color:#9a87a0;font-size:14px;padding:20px}
/* admin */
#adm{position:fixed;inset:0;z-index:100;display:none}
#adm.on{display:block}
#adm.pon{pointer-events:none}
.login{position:absolute;inset:0;background:rgba(40,15,50,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;animation:fade .3s}
.lg{width:100%;max-width:360px;background:var(--off);border-radius:28px;padding:34px 24px 26px;text-align:center;position:relative;box-shadow:0 40px 80px -30px rgba(40,10,50,.6);border:1px solid #ecdcc4;animation:pop .45s cubic-bezier(.2,1.2,.4,1)}
.lg .lic{width:58px;height:58px;margin:0 auto 12px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,#8a3fa3,#5a2470);color:#f1dcae;box-shadow:0 12px 24px -10px #5a2470}
.lg .lic svg{width:24px;height:24px}
.lg h3{font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--roxo)}
.lg p{font-size:13.5px;color:#7a6280;margin:4px 0 18px}
.lg input{width:100%;border:1px solid #e4d3ea;border-radius:14px;padding:14px;font:400 16px Jost,sans-serif;text-align:center;outline:none;margin-bottom:12px;background:#fff}
.lg input:focus{border-color:var(--roxo2);box-shadow:0 0 0 3px rgba(138,63,163,.15)}
.lg small{display:block;color:#b2344b;font-size:12.5px;min-height:18px;margin-top:10px}
.shake{animation:shake .45s}
.drawer{pointer-events:auto;position:absolute;top:0;right:0;bottom:0;width:min(460px,100%);background:#fff;display:flex;flex-direction:column;box-shadow:-24px 0 60px -24px rgba(60,20,80,.4);transition:transform .45s cubic-bezier(.2,.8,.2,1);animation:slide .5s cubic-bezier(.2,.8,.2,1)}
#adm.peek .drawer{transform:translateX(105%)}
.back{display:none;position:absolute;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);pointer-events:auto;border:0;border-radius:99px;padding:14px 22px;background:linear-gradient(120deg,#5a2470,#9b4fb5);color:#fff;font:600 14px Jost,sans-serif;box-shadow:0 14px 30px -10px #5a2470;cursor:pointer}
#adm.peek .back{display:block;animation:pop .4s}
.dh{padding:18px 20px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(120deg,#5a2470,#8a3fa3);color:#fff;padding-top:calc(18px + env(safe-area-inset-top))}
.dh b{font-family:'Cormorant Garamond',serif;font-size:24px;display:block}
.dh small{font-size:12px;opacity:.8}
.dh .x{position:static;background:rgba(255,255,255,.16);color:#fff}
.tabs{display:flex;gap:6px;padding:10px 14px;overflow-x:auto;border-bottom:1px solid #f0e6f3;scrollbar-width:none;flex:none}
.tabs button{border:0;background:#f5eef8;color:var(--roxo);padding:9px 14px;border-radius:99px;font:500 13px Jost,sans-serif;white-space:nowrap;cursor:pointer;transition:.2s}
.tabs button.on{background:var(--roxo);color:#fff}
.dbx{flex:1;overflow-y:auto;padding:18px 18px 30px;background:#fcf9fb}
.dbx h5{font-family:'Cormorant Garamond',serif;font-size:21px;color:var(--roxo);margin:4px 0 12px}
.f{display:block;margin-bottom:14px}
.f>span{display:block;font-size:11.5px;font-weight:600;letter-spacing:.06em;color:#6b4a78;margin-bottom:6px;text-transform:uppercase}
.f input:not([type=checkbox]):not([type=range]),.f textarea,.f select{width:100%;border:1px solid #e6d7ec;border-radius:12px;padding:11px 13px;font:400 15px Jost,sans-serif;color:var(--ink);background:#fff;outline:none;transition:.2s;resize:vertical}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--roxo2);box-shadow:0 0 0 3px rgba(138,63,163,.13)}
.f em{display:block;font-style:normal;font-size:12px;color:#9a87a0;margin-top:5px;line-height:1.4}
.f input[type=range]{width:100%;accent-color:var(--roxo2)}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink);margin-bottom:14px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--roxo2)}
.item{background:#fff;border:1px solid #eee2f2;border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:0 6px 18px -14px rgba(90,36,112,.4)}
.ih{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ih .mini{width:42px;height:42px;flex:none}
.ih b{flex:1;font-size:14px;color:var(--roxo);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl{display:flex;gap:4px}
.tl button{width:32px;height:32px;border-radius:10px;border:1px solid #eadcef;background:#fff;color:var(--roxo);cursor:pointer;font-size:14px}
.tl button.del{color:#b2344b}
.tl button.armed{background:#b2344b;color:#fff;width:auto;padding:0 8px;font-size:12px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-s{border:1px dashed #c9a2dc;background:#faf4fc;color:var(--roxo);border-radius:12px;padding:12px 14px;font:500 14px Jost,sans-serif;cursor:pointer;width:100%;transition:.2s}
.btn-s:hover{background:#f3e6f8}
.btn-l{display:inline-block;font-size:12.5px;color:var(--roxo2);margin:-6px 12px 14px 0;text-decoration:none;font-weight:500;background:none;border:0;cursor:pointer;padding:0}
.logo-ed{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.logo-ed img{width:120px;border-radius:14px;border:1px solid #eee2f2;background:var(--off)}
.ph-ed{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.ph-ed img,.ph-ed .phx{width:56px;height:56px;border-radius:12px;object-fit:cover;background:#f3e4f6}
.note{font-size:12.5px;color:#7a6280;background:#f8f0fa;border-radius:12px;padding:10px 12px;line-height:1.5;margin-bottom:14px}
.df{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #f0e6f3;display:flex;gap:10px;background:#fff;flex:none}
.btn-p{flex:1;border:0;border-radius:14px;padding:14px;background:linear-gradient(120deg,#5a2470,#9b4fb5);color:#fff;font:600 15px Jost,sans-serif;cursor:pointer;box-shadow:0 10px 20px -10px #5a2470;transition:.2s}
.btn-p:disabled{opacity:.6;cursor:wait}
.btn-g{border:1px solid #e6d7ec;background:#fff;border-radius:14px;padding:14px 16px;color:var(--roxo);font:500 14px Jost,sans-serif;cursor:pointer}
@media(min-width:900px){.df .btn-g{display:none}}
#toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);background:#2d1636;color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;z-index:200;opacity:0;transition:.35s;max-width:min(92vw,420px);text-align:center;pointer-events:none;box-shadow:0 14px 30px -12px rgba(0,0,0,.4)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.err{background:#8b1e35}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7px) rotate(3deg)}}
@keyframes icoin{0%{opacity:0;transform:translateY(-52%) scale(.2) rotate(-60deg)}100%{opacity:1}}
@keyframes jelly{0%{transform:scale(1)}30%{transform:scale(1.22,.82)}50%{transform:scale(.86,1.14)}70%{transform:scale(1.08,.94)}100%{transform:scale(1)}}
@keyframes autoshine{0%,72%{transform:translateX(-160%) skewX(-20deg)}88%,100%{transform:translateX(330%) skewX(-20deg)}}
@keyframes twinkle2{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7) rotate(0)}50%{opacity:1;transform:scale(1.1) rotate(25deg)}}
@keyframes rip{to{transform:scale(4);opacity:0}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes slide{from{transform:translateX(100%)}to{transform:none}}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes tip{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
@keyframes pom{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes hatdrop{0%{opacity:0;transform:translate(-50%,-260%) rotate(calc(var(--hr) - 25deg))}100%{opacity:1;transform:translate(-50%,-78%) rotate(var(--hr))}}
@keyframes fall{to{transform:translate3d(18px,calc(100vh + 40px),0)}}
@keyframes swing{from{transform:translateX(-50%) rotate(-7deg)}to{transform:translateX(-50%) rotate(7deg)}}
@keyframes ornin{0%{opacity:0;transform:translateX(-50%) translateY(-60px)}100%{opacity:1;transform:translateX(-50%) rotate(-7deg)}}
@keyframes blob{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(14vmax,10vmax,0) scale(1.15)}}
@keyframes idle{0%{transform:translateY(0) rotateY(0)}30%{transform:translateY(-8px) rotateY(0)}60%{transform:translateY(0) rotateY(0)}72%{transform:translateY(-10px) rotateY(180deg) scale(1.06)}84%,100%{transform:translateY(0) rotateY(360deg)}}
@keyframes ring{0%{transform:scale(1);opacity:.85}70%,100%{transform:scale(1.25,1.7);opacity:0}}
@keyframes logoin{from{opacity:0;transform:scale(.86) translateY(10px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes grow{from{opacity:0;transform:scaleX(.2)}to{opacity:1;transform:none}}
@keyframes blink{0%,100%{opacity:.3}45%,55%{opacity:1}}
@keyframes sway2{from{transform:translateX(-12px)}to{transform:translateX(12px)}}
@keyframes drift{from{transform:translateX(-14px) rotate(0)}to{transform:translateX(14px) rotate(180deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.snow{display:none}}
</style>
